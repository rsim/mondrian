name: Prune development release

# Deletes superseded JARs from the development prerelease. The jar workflow adds one asset per
# commit, so the release grows without a limit.
#
# An asset survives while it is the newest build of a branch. The jar workflow has a paths
# filter, so the head commit of a branch often has no asset. This workflow therefore walks back
# from each head to the newest ancestor that has one. That keeps the build a reviewer needs,
# however old the branch is. Age only removes the builds that later pushes superseded.
#
# Run this workflow by hand to prune sooner, with a smaller keep_days value. It always keeps the
# newest build of every branch. To remove every asset, delete the release itself with
# `gh release delete development`.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Keep superseded assets that are newer than this many days'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        # rev-list needs the full history of every branch, to find the newest ancestor commit that
        # has an asset.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete superseded assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days || '30' }}
        run: |
          set -euo pipefail
          # Only a 404 means there is nothing to prune. A rate limit or a bad token must fail the
          # job, or a run that prunes nothing looks the same as a run that had nothing to prune.
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/development" \
                         2>"$RUNNER_TEMP/gh_error"); then
            if grep -q '(HTTP 404)' "$RUNNER_TEMP/gh_error"; then
              echo "The development release does not exist. Nothing to prune."
              exit 0
            fi
            echo "::error::Cannot read the development release."
            cat "$RUNNER_TEMP/gh_error" >&2
            exit 1
          fi
          shas=$RUNNER_TEMP/asset_shas.txt
          echo "$release" | jq -r '.assets[].name' \
            | sed -n 's/^mondrian-olap-java-\(.*\)\.jar$/\1/p' | sort -u > "$shas"
          # An asset exists only for a commit that somebody pushed to this repository. A fork
          # pushes to its own repository, so its build is an asset of the release of the fork.
          heads=$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].commit.sha')
          # The jar workflow has a paths filter, so a head commit often has no asset of its own.
          # Protect the newest ancestor of the head that has one. That asset is the build of the
          # branch, and age alone must not delete it while somebody still works on the branch.
          # A branch that somebody pushed after the checkout is not in the clone, so cat-file
          # skips it.
          protected=$(
            for head in $heads; do
              git cat-file -e "$head^{commit}" 2>/dev/null || continue
              # grep -m1 closes the pipe, so rev-list ends with SIGPIPE. Read the match, not the
              # exit status.
              git rev-list "$head" | grep -m1 -Fx -f "$shas" || true
            done | sort -u
          )
          echo "Protected commits: $(echo "$protected" | grep -c . || true)"
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%s)
          deleted=0
          kept_branch=0
          kept_recent=0
          while IFS=$'\t' read -r id name created; do
            [ -n "$id" ] || continue
            sha=${name#mondrian-olap-java-}
            sha=${sha%.jar}
            if echo "$protected" | grep -qx "$sha"; then
              kept_branch=$((kept_branch + 1))
              continue
            fi
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
              echo "Deleted $name (created $created)"
              deleted=$((deleted + 1))
            else
              kept_recent=$((kept_recent + 1))
            fi
          done < <(echo "$release" | jq -r '.assets[] | [.id, .name, .created_at] | @tsv')
          {
            echo "### Prune development release"
            echo
            echo "| Result | Count |"
            echo "| --- | --- |"
            echo "| Deleted | $deleted |"
            echo "| Kept, newest build of a branch | $kept_branch |"
            echo "| Kept, newer than $KEEP_DAYS days | $kept_recent |"
          } >> "$GITHUB_STEP_SUMMARY"
