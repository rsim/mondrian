name: Prune engine-dev

# Deletes old JARs from the engine-dev prerelease. The jar workflow adds one asset per commit,
# so the release grows without a limit. An asset stays valid while a consumer can still have
# its commit locked, and 30 days covers that. A pruned JAR builds again from its commit.
#
# Run this workflow by hand to clear the release sooner. Set keep_days to 0 to delete every
# asset.

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      keep_days:
        description: 'Keep assets that are newer than this many days'
        required: false
        default: '30'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete old assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_DAYS: ${{ inputs.keep_days || '30' }}
        run: |
          set -euo pipefail
          if ! release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/engine-dev" 2>/dev/null); then
            echo "The engine-dev release does not exist. Nothing to prune."
            exit 0
          fi
          cutoff=$(date -u -d "$KEEP_DAYS days ago" +%s)
          deleted=0
          kept=0
          while IFS=$'\t' read -r id name created; do
            [ -n "$id" ] || continue
            if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id"
              echo "Deleted $name (created $created)"
              deleted=$((deleted + 1))
            else
              kept=$((kept + 1))
            fi
          done < <(echo "$release" | jq -r '.assets[] | [.id, .name, .created_at] | @tsv')
          echo "Deleted $deleted asset(s), kept $kept." >> "$GITHUB_STEP_SUMMARY"
