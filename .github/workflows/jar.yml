name: Engine JAR

# Builds the engine JAR for every branch and publishes it as an asset of the development
# prerelease. A consumer downloads the JAR for one commit instead of building it locally:
#
#   https://github.com/rsim/mondrian-olap-java/releases/download/development/mondrian-olap-java-<sha>.jar
#
# Assets on a public repository download without a token, unlike workflow artifacts.
# Each asset carries the full commit SHA in its name, so a moved branch cannot give a consumer
# a JAR that does not match the source that it uses. The prune_development_release workflow deletes
# old assets.

on:
  push:
    branches:
      - '**'
    paths:
      - 'pom.xml'
      - 'mondrian/pom.xml'
      - 'mondrian/build.xml'
      - 'mondrian/src/**'
      - 'mondrian/README.txt'
      - 'lib-repo/**'
      - 'LICENSE.html'
      - '.github/workflows/jar.yml'

concurrency:
  # A second push to the same branch replaces the first build. The commit that it cancels gets
  # no asset, and a consumer then falls back to a local build.
  group: jar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-24.04
    env:
      JAVA_OPTS: -Xmx2048m
    steps:
      - name: Checkout code
        # The job holds contents: write for the release upload, and gh reads that token from
        # GH_TOKEN. Keep it out of .git/config, where every Maven plugin could read it.
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set JAVA home
        # The POM targets release 8, so any JDK from 11 up produces the same class files.
        # 11 is the version that the build documentation recommends.
        run: echo "JAVA_HOME=$JAVA_HOME_11_X64" >> $GITHUB_ENV
      - name: Output JAVA version
        run: $JAVA_HOME/bin/java -version
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-
      - name: Build the JAR
        # -DskipTests skips the legacy Java suite, which needs a preloaded FoodMart database.
        run: mvn package -q -DskipTests -Dsource.revision="$GITHUB_SHA"
      - name: Name the JAR after the commit
        id: asset
        run: |
          set -euo pipefail
          # Without nullglob an empty directory leaves the unexpanded pattern in the array,
          # which hides the real problem behind a copy error.
          shopt -s nullglob
          jars=(mondrian/target/mondrian-olap-java-*.jar)
          if [ ${#jars[@]} -ne 1 ]; then
            echo "::error::Expected one engine JAR in mondrian/target, found ${#jars[@]}"
            exit 1
          fi
          asset="mondrian-olap-java-$GITHUB_SHA.jar"
          cp "${jars[0]}" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "version=$(basename "${jars[0]}" .jar | sed 's/^mondrian-olap-java-//')" >> "$GITHUB_OUTPUT"
      - name: Upload the JAR as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine-jar
          path: ${{ steps.asset.outputs.asset }}
          retention-days: 14
      - name: Publish the JAR to the development release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ steps.asset.outputs.asset }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! gh release view development >/dev/null 2>&1; then
            # The tag only holds the assets, so it points at the default branch and stays there.
            # Two branches can reach this at the same time, and the second create then fails.
            # Accept that one case only, which the release view proves.
            if ! gh release create development \
              --target "$DEFAULT_BRANCH" \
              --prerelease \
              --title 'Development builds' \
              --notes 'One engine JAR per commit, named after the commit SHA. These builds are for development only. A superseded build is pruned after 30 days. The newest build of every branch is kept.'; then
              gh release view development >/dev/null
            fi
          fi
          gh release upload development "$ASSET" --clobber
      - name: Write the step summary
        env:
          ASSET: ${{ steps.asset.outputs.asset }}
          VERSION: ${{ steps.asset.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Engine JAR"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Source revision | [\`$GITHUB_SHA\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) |"
            echo "| Size | $(du -h "$ASSET" | cut -f1) |"
            echo "| SHA-256 | \`$(sha256sum "$ASSET" | cut -d' ' -f1)\` |"
            echo
            echo "Download:"
            echo
            echo '```'
            echo "curl -fL -o $ASSET \\"
            echo "  ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/development/$ASSET"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
